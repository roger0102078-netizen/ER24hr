<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER24hr 急診醫師 24 小時</title>
<style>
:root{--bg:#0f1720;--card:#192433;--card2:#223046;--tx:#e6edf5;--mut:#8ea0b5;--ac:#4cc2ff;--ok:#3ecf8e;--bad:#ff5d5d;
--t1:#e5484d;--t2:#f76b15;--t3:#f5c518;--t4:#3ecf8e;--t5:#4cc2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid #33465f;border-radius:8px;padding:5px 8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
#top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:#111c29;border-bottom:1px solid #263449;position:sticky;top:0;z-index:5}
#clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{min-width:90px}.stat small{color:var(--mut);display:block;font-size:11px}
.bar{height:8px;background:#0b121a;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
#main{display:grid;grid-template-columns:360px 1fr 430px;gap:12px;padding:12px}
@media(max-width:1000px){#main{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:12px;padding:10px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
.legend{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;margin-bottom:8px}
.legend span{padding:1px 6px;border-radius:6px;color:#111;font-weight:600}
.pt{display:flex;gap:8px;align-items:center;padding:7px;border-radius:8px;background:var(--card2);margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.pt.sel{border-color:var(--ac)}
.tri{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}
.pt .m{flex:1;min-width:0}.pt .m b{display:block}.pt .m span{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bed{background:var(--card2);border-radius:10px;padding:10px;min-height:112px;border:1px solid transparent;cursor:pointer}
.bed.sel{border-color:var(--ac)}.bed.busy{box-shadow:0 0 0 2px var(--ok) inset}
.bed.empty{opacity:.6;cursor:default;text-align:center;color:var(--mut)}
.bname{display:flex;gap:6px;align-items:center}.bname small{margin-left:auto;color:var(--mut)}
.bscene{position:relative;height:124px;margin:5px 0;border-radius:8px;overflow:hidden;background:linear-gradient(#2c3d56,#1d2a3d)}
.bscene.dimmed{filter:brightness(.55)}
.bcur{position:absolute;left:0;top:0;bottom:34%;width:24%;background:repeating-linear-gradient(90deg,#3d6a8a 0 6px,#35607f 6px 12px);opacity:.85;border-radius:0 0 22px 0}
.bmat{position:absolute;left:10%;right:5%;bottom:8px;height:22px;background:#dfe8f0;border-radius:8px 8px 4px 4px;box-shadow:0 5px 0 #7c8aa0}
.bfig{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;pointer-events:none}
.mmon{position:absolute;right:6px;top:6px;background:#04120a;border:1px solid #1d3a2a;border-radius:5px;padding:2px 5px;font:700 11px ui-monospace,Consolas,monospace;color:#39ff7a;text-align:center;z-index:2}
.mmon svg{display:block;width:56px;height:14px;overflow:hidden}.mmon.al{color:#ff5252;border-color:#7a1f24;animation:blink 1s infinite}.mmon.off{opacity:.3;color:#6a8}
.mscroll{animation:mscroll 1.4s linear infinite}@keyframes mscroll{to{transform:translateX(-56px)}}
.doing{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--pr,0%),#33465f 0);animation:dpulse 1s ease-in-out infinite;z-index:2}
.doing span{background:#0f1720;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px}
@keyframes dpulse{50%{transform:scale(1.1)}}
.bed.dead{filter:grayscale(1);opacity:.85;cursor:default}
.sheet{position:absolute;left:10%;right:5%;bottom:14px;height:44px;background:#eef2f6;border-radius:22px 22px 4px 4px;color:#556;font-size:12px;display:grid;place-items:center;z-index:1}
.fig.wob{animation:wob 1.3s ease-in-out infinite;transform-origin:50% 100%}@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.tag{background:#0b121a;border-radius:6px;padding:1px 6px;font-size:11px}
.tag.tr,.tag.nt,.tag.six{background:#27384f;color:#c8d6e6}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px}
.grid3 button{font-size:12px;padding:5px 3px}
.gl{font-size:11px;color:var(--mut);margin:6px 0 3px}
.res{font-size:12px;color:var(--mut)}.res b{color:var(--tx)}
.warn{color:var(--bad)}
#log{height:150px;overflow:auto;font-size:12.5px;color:var(--mut)}
#log div{padding:2px 0;border-bottom:1px solid #223046}
#log .g{color:var(--ok)}#log .r{color:var(--bad)}#log .y{color:var(--t3)}
.overlay{position:fixed;inset:0;background:rgba(5,10,18,.45);display:grid;place-items:center;z-index:10;padding:16px;overflow:auto}
.box{background:var(--card);padding:24px;border-radius:14px;max-width:560px;width:100%}
.box h1{margin:0 0 8px}.box p{color:var(--mut)}
.big{font-size:56px;font-weight:800;line-height:1}
.mon{background:#04120a;border:2px solid #1d3a2a;border-radius:8px;margin:8px 0;overflow:hidden;font-family:ui-monospace,Consolas,monospace}
.monwave{position:relative;border-bottom:1px solid #1d3a2a;background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(57,255,122,.07) 15px 16px),repeating-linear-gradient(90deg,transparent 0 25px,rgba(57,255,122,.07) 25px 26px)}
.monlab{position:absolute;left:6px;top:2px;font-size:11px;color:#39ff7a;opacity:.8}
.monnum{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:2px 0;padding:4px 0}
.monnote{padding:2px 8px 5px;font-size:11px;color:#7aa88a;border-top:1px solid #10281b}
@keyframes blink{50%{opacity:.25}}
.fig{flex:none;overflow:visible}
@media(min-width:1001px){.dock{position:sticky;top:calc(var(--toph,64px) + 8px);max-height:calc(100vh - var(--toph,64px) - 20px)}}
.dock{display:flex;flex-direction:column;align-self:start}.dock .head,.dock .foot{flex:none}.dock .body{flex:1;overflow:auto;min-height:140px;margin:6px -4px;padding:0 4px}
.dock .foot{border-top:1px solid #33465f;padding-top:8px}
.pt .m span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@keyframes critbox{50%{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset}}
.crit{border-color:var(--bad);animation:critbox .8s infinite}
button.on{background:var(--ac);color:#04121c;border-color:var(--ac);font-weight:700}
.dim{opacity:.55}
#tasks{position:fixed;left:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 20px))}
.mtask{background:rgba(25,36,51,.97);border:1px solid #4a6a8a;border-left:4px solid var(--t3);border-radius:10px;padding:8px 10px;box-shadow:0 4px 16px #0008}
.mth{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}.mth small{color:var(--mut);font-weight:400}
.mtq{font-size:12.5px;margin:4px 0 6px;color:#dbe6f1}
.mto{display:block;width:100%;text-align:left;margin-top:4px;padding:5px 8px;font-size:12.5px}
.fx{position:absolute;left:50%;transform:translateX(-50%);top:6px;font-weight:800;font-size:17px;animation:fxup 2.5s ease-out forwards;z-index:3;text-shadow:0 1px 4px #000;white-space:nowrap}
.fx.up{color:#3ecf8e}.fx.flat{color:#9fb0c3;font-size:12px}.fx.down{color:#ff5d5d}
@keyframes fxup{0%{opacity:0;top:56px}15%{opacity:1}75%{opacity:1}100%{opacity:0;top:4px}}
.mmon.upg{border-color:#3ecf8e;box-shadow:0 0 8px #3ecf8e}
.chk{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}.ck{font-size:11px;padding:1px 6px;border-radius:6px;background:#0b121a}.ck.ok{color:var(--ok)}.ck.wait{color:#f5c518}
#badges{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.bdg.ok{background:linear-gradient(90deg,#0f5132,#177a4a);color:#d9ffe9}.bdg.bad{background:linear-gradient(90deg,#6b1a1f,#a3262e);color:#ffe0e0}.bdg{max-width:92vw;border-radius:16px!important;text-align:center;background:linear-gradient(90deg,#6b4b00,#a87a00);color:#fff4cc;font-weight:800;padding:8px 18px;border-radius:999px;box-shadow:0 4px 16px #000a;animation:bdgin .4s ease-out}
@keyframes bdgin{from{transform:translateY(20px);opacity:0}}
.ttl{display:inline-block;margin:3px;padding:3px 10px;border-radius:999px;background:#3a3216;border:1px solid #f5c518;color:#ffe9a8;font-size:13px}
#beds{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))!important}.bscene{height:108px!important}.bfig .fig{width:84px!important;height:auto!important}
.nag{animation:figshake .22s 5}.nagtxt{margin:6px 0;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 8px}.tabbtn{padding:4px 10px;font-size:12.5px;border-radius:999px}
button.hi{border-color:#f5c518!important;background:#3a3216!important;box-shadow:0 0 0 1px #f5c518 inset}
.ver{font-size:11px;color:#8ea0b5;margin-top:6px}
.fresh{animation:freshp .9s ease-in-out infinite!important;border-color:var(--ac)!important}@keyframes freshp{50%{box-shadow:0 0 0 3px var(--ac),0 0 14px var(--ac)}}
#veil{position:fixed;top:calc(var(--toph,64px) + 6px);left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;align-items:center;max-width:94vw;background:rgba(25,36,51,.96);border:2px solid var(--t3);border-radius:12px;padding:6px 14px;z-index:6;box-shadow:0 4px 16px #0007}
#veil .vt{font-size:18px;font-weight:800;color:var(--t3);white-space:nowrap}#veil .vs{font-size:12px;color:var(--tx)}
#veil button{font-size:14px;padding:5px 12px;background:var(--t3);color:#111;font-weight:700;white-space:nowrap}
.idlebar.wait{background:#1f2a38;border-color:#3b4f68;color:#9fb0c3;animation:none;cursor:default;font-weight:400}
/* 中寬度：兩欄（左：診間＋候診區＋紀錄，右：處置面板固定） */
@media(min-width:700px) and (max-width:1000px){
 #main{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"beds dock" "lobby dock" "log dock";align-items:start}
 .pbeds{grid-area:beds;order:0}.plobby{grid-area:lobby;order:0}.plog{grid-area:log;order:0;margin-top:0!important}
 .dock{grid-area:dock;order:0;position:sticky;top:calc(var(--toph,64px) + 62px);max-height:calc(100vh - var(--toph,64px) - 76px)}
}
/* 寬螢幕：候診區固定在左側並可獨立捲動 */
@media(min-width:1001px){.plobby{position:sticky;top:calc(var(--toph,64px) + 8px);max-height:calc(100vh - var(--toph,64px) - 20px);overflow:auto;align-self:start}}
.idle{color:#ff9f43;animation:blink .9s infinite}
.idlebar{flex:none;background:#5a3a12;border:1px solid #ff9f43;color:#ffd9a8;font-weight:700;border-radius:8px;padding:7px 10px;margin-bottom:8px;cursor:pointer;animation:idlepulse 1.6s ease-in-out infinite}
@keyframes idlepulse{50%{background:#7a4c14}}
.ydot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f5c518;box-shadow:0 0 6px #f5c518;flex:none}
.qline{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px}.qi{background:#0b121a;border-radius:6px;padding:1px 4px;white-space:nowrap}.qx{border:0;background:none;padding:0 3px;color:var(--bad);font-size:11px;cursor:pointer}
.tag.qq{opacity:.5;filter:grayscale(1)}
.tag.alert{background:#7a1f24;color:#ffd0d0;font-weight:700;animation:blink 1s infinite}
.qbtn{width:100%;text-align:left;margin-top:6px;padding:10px 12px;font-size:14px}
#bedbar{display:none}
.pt.late{border-color:#ff8a3d;background:#33262a}.pt.late>small{color:#ff8a3d;font-weight:700;text-align:center}
@media(max-width:1000px){
 #main>div:nth-child(2){display:contents}
 .pbeds{order:1}.dock{order:2}.plobby{order:3}.plog{order:4;margin-top:0!important}
 #bedbar{display:flex;gap:6px;overflow-x:auto;position:sticky;top:var(--toph,64px);z-index:4;background:#0f1720ee;padding:6px 10px;border-bottom:1px solid #263449}
 #bedbar .chip{flex:none;display:flex;gap:6px;align-items:center;min-width:104px;padding:4px 6px;border-radius:8px;background:var(--card2);border:1px solid transparent;font-size:12px;cursor:pointer}
 #bedbar .chip.sel{border-color:var(--ac)}#bedbar .chip.empty{opacity:.4;justify-content:center}#bedbar .chip .bar{width:60px;margin-top:2px}
 #bedbar .tri{width:20px;height:20px;font-size:12px}
}
.stat.low{animation:figshake .35s infinite}.stat.low small{color:var(--bad);font-weight:700}
.mini{font-size:11px;padding:1px 7px;border-radius:999px;background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.mini:hover:not(:disabled){color:var(--ac);border-color:var(--ac)}
#paused{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5c518;color:#111;font-size:22px;font-weight:800;padding:8px 22px;border-radius:12px;z-index:6;pointer-events:none;box-shadow:0 4px 18px #0008;white-space:nowrap}
.key{color:var(--ac);font-weight:700}
.pt .m b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1300px){.pt .fig{width:56px;height:auto}}
.fig.shake{animation:figshake .35s infinite}
@keyframes figshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.overlay.intro{background:#050b16;padding:0;display:block;place-items:normal;overflow:auto}
.scene{position:fixed;inset:0;overflow:hidden;z-index:0}.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(3,8,16,.6) 100%),linear-gradient(180deg,rgba(3,8,16,.55),transparent 30%,transparent 70%,rgba(3,8,16,.5))}
.amb{position:absolute;left:50%;width:min(26vmax,420px);margin-left:calc(min(26vmax,420px) / -2);will-change:transform}
.amb svg{width:100%;height:auto;display:block;overflow:visible}
.a1{bottom:13%;animation:ambin 13s linear infinite}
.a2{bottom:5%;animation:ambout 9s linear infinite 3s;transform:translateX(120vw) scaleX(-1)}
@keyframes ambin{0%{transform:translateX(-120vw)}26%{transform:translateX(0);animation-timing-function:ease-out}55%{transform:translateX(0)}88%{transform:translateX(120vw)}100%{transform:translateX(120vw)}}
@keyframes ambout{0%{transform:translateX(120vw) scaleX(-1)}70%{transform:translateX(-120vw) scaleX(-1)}100%{transform:translateX(-120vw) scaleX(-1)}}
.lr{animation:lred .5s steps(1) infinite}.lb{animation:lblue .5s steps(1) infinite}
@keyframes lred{0%{fill:#ff2b3a;filter:drop-shadow(0 0 6px #ff2b3a)}50%{fill:#5a1a20;filter:none}}
@keyframes lblue{0%{fill:#1b2a5a;filter:none}50%{fill:#3d8bff;filter:drop-shadow(0 0 6px #3d8bff)}}
.wash{opacity:0;animation:wash .5s steps(1) infinite;filter:blur(22px)}
@keyframes wash{0%{fill:#ff2b3a;opacity:.22}50%{fill:#3d8bff;opacity:.2}}
.glow{animation:glow 2.4s ease-in-out infinite}
.neon{animation:neon 5s infinite}@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}21%{opacity:.9}}@keyframes glow{50%{filter:drop-shadow(0 0 14px #ff4d55) brightness(1.2)}}
.wf{animation:wf 6s infinite}@keyframes wf{0%,88%{opacity:1}92%{opacity:.25}96%{opacity:1}}
.st{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.ibox{position:relative;z-index:1;width:100%;max-width:900px;margin:0 auto;padding:22px 18px 22px;text-align:center;min-height:100vh;display:flex;flex-direction:column}
.itop{background:rgba(5,10,18,.62);backdrop-filter:blur(5px);border-radius:16px;padding:12px 18px;align-self:center;box-shadow:0 6px 24px #0008}
.ispace{flex:1;min-height:150px}
.ibot{background:rgba(5,10,18,.55);backdrop-filter:blur(4px);border-radius:16px;padding:10px 12px}
.ititle{font-size:clamp(40px,8vw,68px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,#ffb3b8 50%,#7fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ititle .ie{-webkit-text-fill-color:#fff;color:#fff;background:none;display:inline-block;animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateX(6px)}}
.isub{color:#cfe2f5;letter-spacing:6px;font-size:14px;margin-top:2px;text-shadow:0 1px 6px #000}
.iecg{width:min(340px,80%);height:30px;margin:8px auto 2px;filter:drop-shadow(0 0 5px #39ff7a)}.iecg path{stroke-dasharray:1;stroke-dashoffset:1;animation:ecgdraw 3s linear infinite}
@keyframes ecgdraw{0%{stroke-dashoffset:1}70%,100%{stroke-dashoffset:0}}
.ilead{color:#e6edf5;font-size:16px;margin:8px 0 12px;text-shadow:0 1px 6px #000}
.irules{background:rgba(15,23,32,.78);backdrop-filter:blur(6px);border:1px solid #33465f;border-radius:12px;padding:8px 14px;text-align:left;margin:0 auto 14px}
.irules summary{cursor:pointer;font-weight:700;color:var(--ac)}.irules p{color:#c3d1e0;font-size:13.5px;margin:8px 0}
.iname{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0 8px;color:#e6edf5}.iname input{background:rgba(15,23,32,.85);border:1px solid #33465f;border-radius:8px;padding:7px 10px;color:#fff;font:inherit;width:220px}.iname input:focus{outline:none;border-color:var(--ac)}.iname small{color:#9fb0c3;font-size:12px}
.ihead{color:#fff;font-weight:700;font-size:15px;margin:6px 0 10px;text-shadow:0 1px 6px #000}
.ilv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.lvbtn{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(15,23,32,.82);backdrop-filter:blur(6px);border:1px solid #33465f;transition:transform .15s,border-color .15s}
.lvbtn:hover{transform:translateY(-2px);border-color:#fff}.lvn{display:flex;justify-content:space-between;align-items:center}.lvn b{font-size:17px}.lvd{font-size:10px;letter-spacing:1px;color:var(--t3)}.lvt{font-size:12px;color:#aebccd;margin-top:4px}
.lv0{border-left:5px solid #3ecf8e}.lv1{border-left:5px solid #4cc2ff}.lv2{border-left:5px solid #f5c518}.lv3{border-left:5px solid #f76b15}.lv4{border-left:5px solid #e5484d}.lv5{border-left:5px solid #b44cff}
@media(prefers-reduced-motion:reduce){.amb,.lr,.lb,.wash,.glow,.wf,.st,.iecg path{animation:none}.a1{transform:translateX(0)}.a2{display:none}}
/* ===== 首頁 v2：左側操作面板＋右側完整建築場景（手機版：場景在上、面板在下）===== */
.overlay.intro{display:flex;flex-direction:column;overflow:auto;padding:0;place-items:normal;background:#050b16}
.iscene{position:relative;flex:none;height:46vh;min-height:260px;overflow:hidden}
.iscene .scene{position:absolute;inset:0}
.iscene .vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(3,8,16,.55) 100%),linear-gradient(180deg,rgba(3,8,16,.35),transparent 25%)}
.icap{position:absolute;left:16px;top:12px;z-index:3;color:#dfe9f5;display:flex;flex-direction:column;gap:2px;font-size:12px;text-shadow:0 1px 6px #000}.icap b{font-size:14px;letter-spacing:2px}
.ipanel{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:18px 16px 30px;text-align:center;background:linear-gradient(180deg,rgba(5,10,20,0),#07111f 40px)}

function pick(night){
 const ws=CASES.map(c=>(((c.six&&S.t<30)||(!c.six&&c.t<=2&&S.t<20))?0:1)*c.w*(S.pts.some(p=>p.cs===c&&p.loc==null)?.02:Math.pow(.2,S.pts.filter(p=>p.cs===c).length))*((S.recent||[]).includes(c)?.4:1)*(c.night?(night?3:.3):1)*(c.six?S.lv.six:(c.t<S.lv.minT?0:1)));let r=Math.random()*ws.reduce((a,b)=>a+b),i=0;
 while(r>ws[i]){r-=ws[i];i++}return CASES[i];
}

  hp:100,stab:false,done:[],pend:[],res:{},loc:null,wait:0,sat:100,arr:S.t,goldDone:false,amb:!!cs.six&&!noAmb};

 if(!silent)log(`${p.amb?'🚑 救護車送來':'🚪 新病人'} ${p.name}：${cs.c}（${cs.cat}・檢傷 ${shown} 級${cs.six&&S.lv.hint>=1?'・六大急症':''}）`,cs.t<=2?'y':'');

 return p;

function patch(a,b){const ac=a.childNodes,bc=b.childNodes;
 for(let i=0;i<bc.length;i++){const n=bc[i];let o=ac[i];
  if(n.nodeType===1&&n.dataset&&n.dataset.do){ // 有 data-do 的按鈕／卡片用 key 對應，順序改變時也保持同一個元素
   const key=n.dataset.do+'|'+n.dataset.a;
   if(!o||!(o.dataset&&o.dataset.do&&o.dataset.do+'|'+o.dataset.a===key)){
    const m=[...ac].slice(i).find(c=>c.nodeType===1&&c.dataset&&c.dataset.do&&c.dataset.do+'|'+c.dataset.a===key);
    if(m)a.insertBefore(m,o||null);}}
  o=ac[i];
  if(!o){a.appendChild(n.cloneNode(true));continue}
  if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){a.replaceChild(n.cloneNode(true),o);continue}
  if(n.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue}
  const keep=o.id==='ecgp';
  for(const at of [...n.attributes]){if(keep&&at.name==='d')continue;if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);}
  for(const at of [...o.attributes])if(!n.hasAttribute(at.name)&&!(keep&&at.name==='d'))o.removeAttribute(at.name);
  patch(o,n);}
 while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);}
